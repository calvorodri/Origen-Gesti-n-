<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Origen - Gestión</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            background: #2d3436;
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 28px;
        }
        
        .user-info {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .logout-btn {
            background: #d32f2f;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .logout-btn:hover {
            background: #b71c1c;
        }
        
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .login-container h2 {
            margin-bottom: 30px;
            color: #2d3436;
        }
        
        .login-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .login-btn {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }
        
        .login-btn:hover {
            opacity: 0.9;
        }
        
        .juan-carlos-btn {
            background: #4CAF50;
            color: white;
        }
        
        .rodrigo-btn {
            background: #2196F3;
            color: white;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .tab-btn {
            padding: 12px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }
        
        .tab-btn.active {
            color: #2196F3;
            border-bottom-color: #2196F3;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .card h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        
        .card-value {
            font-size: 32px;
            font-weight: bold;
            color: #2d3436;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #2196F3;
            box-shadow: 0 0 5px rgba(33,150,243,0.3);
        }
        
        .submit-btn {
            background: #2196F3;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
        }
        
        .submit-btn:hover {
            background: #1976D2;
        }
        
        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .table th {
            background: #f5f5f5;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .table td {
            padding: 12px 15px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .table tr:hover {
            background: #fafafa;
        }
        
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        
        .success {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #999;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Credenciales Supabase
        const SUPABASE_URL = 'https://ncmsdeytrzncjwbgcujn.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5jbXNkZXl0cnpuY2p3YmdndWpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjY0OTkwNTAsImV4cCI6MjA0MjA3NTA1MH0.sb_publishable_G6AW1VE6826mnGpC8ltQ_OPGU3';

        // Funciones para conectar con Supabase
        const supabase = {
            async getProductos() {
                try {
                    const res = await fetch(`${SUPABASE_URL}/rest/v1/Productos?select=*`, {
                        headers: {
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'apikey': SUPABASE_KEY,
                        }
                    });
                    return await res.json();
                } catch (error) {
                    console.error('Error getting productos:', error);
                    return [];
                }
            },

            async getVentas() {
                try {
                    const res = await fetch(`${SUPABASE_URL}/rest/v1/Ventas?select=*&order=id.desc&limit=10`, {
                        headers: {
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'apikey': SUPABASE_KEY,
                        }
                    });
                    return await res.json();
                } catch (error) {
                    console.error('Error getting ventas:', error);
                    return [];
                }
            },

            async addVenta(venta) {
                try {
                    const res = await fetch(`${SUPABASE_URL}/rest/v1/Ventas`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'apikey': SUPABASE_KEY,
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(venta)
                    });
                    return await res.json();
                } catch (error) {
                    console.error('Error adding venta:', error);
                    throw error;
                }
            },

            async getDashboard() {
                try {
                    const ventas = await this.getVentas();
                    const totalVentas = ventas.reduce((sum, v) => sum + (v.Total || 0), 0);
                    const totalMargen = ventas.reduce((sum, v) => sum + (v.Margen || 0), 0);
                    return {
                        totalVentas,
                        totalMargen,
                        transacciones: ventas.length,
                        ultimasVentas: ventas.slice(0, 5)
                    };
                } catch (error) {
                    console.error('Error getting dashboard:', error);
                    return { totalVentas: 0, totalMargen: 0, transacciones: 0, ultimasVentas: [] };
                }
            }
        };

        // Componente Login
        function Login({ onLogin }) {
            return (
                <div className="login-container">
                    <h2>Origen - Gestión</h2>
                    <p style={{ marginBottom: 20, color: '#666' }}>Ingresa para continuar</p>
                    <div className="login-buttons">
                        <button className="login-btn juan-carlos-btn" onClick={() => onLogin('Juan Carlos')}>
                            Juan Carlos
                        </button>
                        <button className="login-btn rodrigo-btn" onClick={() => onLogin('Rodrigo')}>
                            Rodrigo
                        </button>
                    </div>
                </div>
            );
        }

        // Componente Dashboard
        function Dashboard() {
            const [data, setData] = useState({ totalVentas: 0, totalMargen: 0, transacciones: 0, ultimasVentas: [] });
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                supabase.getDashboard().then(data => {
                    setData(data);
                    setLoading(false);
                });
            }, []);

            if (loading) return <div className="loading">Cargando...</div>;

            return (
                <div>
                    <div className="dashboard-grid">
                        <div className="card">
                            <h3>Total Ventas</h3>
                            <div className="card-value">${data.totalVentas.toLocaleString('es-AR')}</div>
                        </div>
                        <div className="card">
                            <h3>Total Margen</h3>
                            <div className="card-value">${data.totalMargen.toLocaleString('es-AR')}</div>
                        </div>
                        <div className="card">
                            <h3>Transacciones</h3>
                            <div className="card-value">{data.transacciones}</div>
                        </div>
                    </div>

                    <div className="card">
                        <h3 style={{ marginBottom: 15 }}>Últimas Ventas</h3>
                        {data.ultimasVentas.length > 0 ? (
                            <table className="table">
                                <thead>
                                    <tr>
                                        <th>Cliente</th>
                                        <th>Producto</th>
                                        <th>Cantidad</th>
                                        <th>Total</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {data.ultimasVentas.map((venta, idx) => (
                                        <tr key={idx}>
                                            <td>{venta.Cliente}</td>
                                            <td>{venta.Producto}</td>
                                            <td>{venta.Cantidad}</td>
                                            <td>${venta.Total}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        ) : (
                            <p style={{ color: '#999' }}>Sin ventas registradas</p>
                        )}
                    </div>
                </div>
            );
        }

        // Componente Nueva Venta
        function NuevaVenta({ onVentaCreada }) {
            const [productos, setProductos] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState('');
            const [success, setSuccess] = useState('');
            const [formData, setFormData] = useState({
                Cliente: '',
                Codigo: '',
                Cantidad: 1
            });

            useEffect(() => {
                supabase.getProductos().then(prods => {
                    setProductos(prods || []);
                    setLoading(false);
                });
            }, []);

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({
                    ...prev,
                    [name]: name === 'Cantidad' ? parseInt(value) : value
                }));
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                setSuccess('');

                if (!formData.Cliente || !formData.Codigo || !formData.Cantidad) {
                    setError('Por favor completa todos los campos');
                    return;
                }

                const producto = productos.find(p => p.Codigo === formData.Codigo);
                if (!producto) {
                    setError('Producto no encontrado');
                    return;
                }

                const venta = {
                    Fecha: new Date().toISOString().split('T')[0],
                    Cliente: formData.Cliente,
                    Producto: producto.Nombre,
                    Codigo: formData.Codigo,
                    Cantidad: formData.Cantidad,
                    Precio_unitario: producto.Precio,
                    Total: producto.Precio * formData.Cantidad,
                    Margen: (producto.Precio - producto.Costo) * formData.Cantidad
                };

                try {
                    await supabase.addVenta(venta);
                    setSuccess('Venta registrada exitosamente');
                    setFormData({ Cliente: '', Codigo: '', Cantidad: 1 });
                    onVentaCreada();
                } catch (err) {
                    setError('Error al registrar la venta: ' + err.message);
                }
            };

            if (loading) return <div className="loading">Cargando productos...</div>;

            const productoSeleccionado = productos.find(p => p.Codigo === formData.Codigo);
            const total = productoSeleccionado ? productoSeleccionado.Precio * formData.Cantidad : 0;
            const margen = productoSeleccionado ? (productoSeleccionado.Precio - productoSeleccionado.Costo) * formData.Cantidad : 0;

            return (
                <div className="card">
                    <h3 style={{ marginBottom: 20 }}>Registrar Nueva Venta</h3>
                    
                    {error && <div className="error">{error}</div>}
                    {success && <div className="success">{success}</div>}

                    <form onSubmit={handleSubmit}>
                        <div className="form-group">
                            <label>Cliente *</label>
                            <input
                                type="text"
                                name="Cliente"
                                value={formData.Cliente}
                                onChange={handleChange}
                                placeholder="Nombre del cliente"
                            />
                        </div>

                        <div className="form-group">
                            <label>Producto *</label>
                            <select
                                name="Codigo"
                                value={formData.Codigo}
                                onChange={handleChange}
                            >
                                <option value="">Selecciona un producto</option>
                                {productos.map(prod => (
                                    <option key={prod.id} value={prod.Codigo}>
                                        {prod.Nombre} - ${prod.Precio}
                                    </option>
                                ))}
                            </select>
                        </div>

                        <div className="form-group">
                            <label>Cantidad *</label>
                            <input
                                type="number"
                                name="Cantidad"
                                value={formData.Cantidad}
                                onChange={handleChange}
                                min="1"
                            />
                        </div>

                        {productoSeleccionado && (
                            <div style={{ padding: 15, background: '#f5f5f5', borderRadius: 4, marginBottom: 20 }}>
                                <p><strong>Precio unitario:</strong> ${productoSeleccionado.Precio}</p>
                                <p><strong>Total:</strong> ${total}</p>
                                <p><strong>Margen:</strong> ${margen}</p>
                            </div>
                        )}

                        <button type="submit" className="submit-btn">Registrar Venta</button>
                    </form>
                </div>
            );
        }

        // Componente Principal
        function App() {
            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [refreshKey, setRefreshKey] = useState(0);

            if (!user) {
                return <Login onLogin={setUser} />;
            }

            return (
                <div className="container">
                    <div className="header">
                        <h1>Origen - Gestión</h1>
                        <div className="user-info">
                            <span>👤 {user}</span>
                            <button className="logout-btn" onClick={() => setUser(null)}>Salir</button>
                        </div>
                    </div>

                    <div className="tabs">
                        <button
                            className={`tab-btn ${activeTab === 'dashboard' ? 'active' : ''}`}
                            onClick={() => setActiveTab('dashboard')}
                        >
                            📊 Dashboard
                        </button>
                        <button
                            className={`tab-btn ${activeTab === 'nueva-venta' ? 'active' : ''}`}
                            onClick={() => setActiveTab('nueva-venta')}
                        >
                            ➕ Nueva Venta
                        </button>
                    </div>

                    {activeTab === 'dashboard' && <Dashboard key={refreshKey} />}
                    {activeTab === 'nueva-venta' && <NuevaVenta onVentaCreada={() => setRefreshKey(k => k + 1)} />}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
